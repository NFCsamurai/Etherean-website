          <img class="player-image" src="img/front.png" alt="Etherean Minecraft character" />

       <span class="item-slot shield-slot" aria-hidden="true">OFF</span>
      </div>

        </div>
        <span class="crafting-arrow" aria-hidden="true">&rarr;</span>
        <span class="item-slot crafting-output" aria-hidden="true"></span>
       </div>
      </div>
     </div>
